# The relay with Docker Compose (docs/RELAY.md, "With Docker"). From the root of the repository:
#   MPFEVER_RELAY_PASSWORD=SECRET docker compose -f server-linux/compose.yaml up -d --build
# or put the line in a file named .env next to this one. The relay is not the dedicated server: it runs no game.
name: mpfever-relay

services:
  relay:
    build:
      context: ..
      dockerfile: server-linux/Dockerfile
    image: mpfever-relay
    restart: unless-stopped
    ports:
      - "28090:28090"
    environment:
      # (a password on a server reachable from the Internet: without one, anybody may join or host)
      MPFEVER_RELAY_PASSWORD: ${MPFEVER_RELAY_PASSWORD:?set MPFEVER_RELAY_PASSWORD}
    command: ["--port", "28090", "--max-players", "6"]
    # (the program writes nothing, unless the save is kept: then /data below)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Keeping the session's save on the server (experimental, off by default): uncomment, and set the key in the environment above
    #   MPFEVER_RELAY_CHECKPOINT_OWNER_KEY: ${MPFEVER_RELAY_CHECKPOINT_OWNER_KEY}
    # with this command and volume:
    #   command: ["--port", "28090", "--max-players", "6", "--checkpoint-dir", "/data"]
    #   volumes: ["relay-data:/data"]
# volumes:
#   relay-data:
