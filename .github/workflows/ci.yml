# Every push and pull request: builds the native module and the launcher (a warning is an error), runs every check that
# needs no game (tests/run_all.py: the repository's checks, the Lua tests, MPFever.exe --selftest) and packs the archives,
# as build.bat does for a release. The tests with the game (two games on one PC) run on a PC with Transport Fever 3.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lua for the tests
        run: python -m pip install lupa==2.8

      - name: Build, test, pack
        shell: pwsh
        run: |
          cmd /c build.bat 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # (what failed, as an annotation of the run: readable without signing in, unlike the log)
      - name: Why it failed
        if: failure()
        shell: pwsh
        run: |
          $lines = Get-Content build.log -ErrorAction SilentlyContinue
          $why = @($lines | Select-String -Pattern 'error|FAIL|warning|not found' | ForEach-Object { $_.Line }) | Select-Object -First 40
          $tail = $lines | Select-Object -Last 25
          $text = (@('--- errors ---') + $why + @('--- end of the log ---') + $tail) -join "`n"
          $text = $text.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
          Write-Output "::error title=build.bat failed::$text"

      - name: Archives
        uses: actions/upload-artifact@v4
        with:
          name: MPFever-${{ github.sha }}
          path: release/*.zip
          retention-days: 14

  # The relay (server-linux/, docs/RELAY.md), NOT the dedicated server (that one is MPFever.exe --server, built above with the
  # launcher): no game in it. Built with a warning as an error, its self-test (real clients, no game) and the self-contained linux-x64
  # binary; the Windows one is the next job.
  linux-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet build server-linux/MPFeverRelay.csproj -c Release

      - name: Self-test
        run: dotnet run --project server-linux/MPFeverRelay.csproj -c Release --no-build -- --selftest

      - name: Publish (linux-x64)
        run: dotnet publish server-linux/MPFeverRelay.csproj -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o artifacts/linux

      # (0.8.16) the published file is trimmed: its own self-test, as the Release workflow does
      - name: Self-test (published, trimmed)
        run: artifacts/linux/mpfever-relay --selftest

      - name: Binary
        uses: actions/upload-artifact@v4
        with:
          name: MPFever-relay-linux-x64-${{ github.sha }}
          path: artifacts/linux/mpfever-relay
          retention-days: 14

  # The same relay on Windows: its self-test, then the self-contained win-x64 binary tested as it will be published.
  windows-relay:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet build server-linux/MPFeverRelay.csproj -c Release

      - name: Self-test
        run: dotnet run --project server-linux/MPFeverRelay.csproj -c Release --no-build -- --selftest

      - name: Publish (win-x64)
        run: dotnet publish server-linux/MPFeverRelay.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o artifacts/windows

      - name: Test the published relay
        run: artifacts/windows/mpfever-relay.exe --selftest

      - name: Binary
        uses: actions/upload-artifact@v4
        with:
          name: MPFever-relay-win-x64-${{ github.sha }}
          path: artifacts/windows/mpfever-relay.exe
          retention-days: 14

  # The relay's optional Docker image (server-linux/Dockerfile): it builds, and the self-test passes inside it as the container
  # will run (read-only, no capabilities).
  docker-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f server-linux/Dockerfile -t mpfever-relay .

      - name: Self-test in the container
        run: docker run --rm --read-only --tmpfs /tmp --cap-drop ALL mpfever-relay --selftest

      - name: Compose file
        run: MPFEVER_RELAY_PASSWORD=ci docker compose -f server-linux/compose.yaml config -q
