# The published archives, started by hand (Actions > Release build > Run workflow, on a branch or a tag): builds them from
# the repository's code with build.bat, as the CI does, then has MPFever.exe and winhttp.dll signed in the players' and the
# dedicated server's archives by SignPath (README.md, "Code signing policy"; .signpath/artifact-configuration.xml is the
# configuration of the SignPath project). Each signature waits for an approver's yes in SignPath. Nothing is published: the
# archives and the relay (Linux x64 and Windows x64; the relay is not the dedicated server: it runs no game) stay in the run's artifacts, to be tested, then attached to a GitHub release by hand. The one exception is the relay's Docker image, pushed to ghcr.io only when "docker" is ticked at the start (off by default). Without SignPath set up
# (secret SIGNPATH_API_TOKEN and variable SIGNPATH_ORGANIZATION_ID of the repository), the archives are left unsigned.
name: Release build

on:
  workflow_dispatch:
    inputs:
      docker:
        description: "Also publish the relay's Docker image (x64 and arm64) to ghcr.io/<owner>/mpfever-relay-docker, tagged with the version and latest"
        type: boolean
        default: false

jobs:
  release:
    runs-on: windows-2022
    # (the signature waits for an approver: up to 2 hours below)
    timeout-minutes: 180
    env:
      SIGNPATH_ON: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lua for the tests
        run: python -m pip install lupa==2.8

      - name: Build, test, pack
        shell: pwsh
        run: |
          cmd /c build.bat 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path build.bat -Pattern '^set "VERSION=([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      # (the two archives the players and the servers download; the server list's is for its own PC only)
      - name: Unsigned archives
        uses: actions/upload-artifact@v4
        with:
          name: MPFever-${{ steps.version.outputs.version }}-unsigned
          path: |
            release/MPFever-${{ steps.version.outputs.version }}.zip
            release/MPFever-${{ steps.version.outputs.version }}-server.zip
          if-no-files-found: error
          retention-days: 30

      # (SignPath gets the archives' two folders, not the zips: build.bat's zips name their entries with backslashes, which
      # MPFever's updater reads but other tools may not; the signed folders are zipped again below as build.bat does)
      - name: Folders to sign
        if: env.SIGNPATH_ON == 'true'
        id: tosign
        uses: actions/upload-artifact@v4
        with:
          name: MPFever-${{ steps.version.outputs.version }}-to-sign
          path: |
            release/dist/MPFever
            release/dist-server/MPFever-Server
          if-no-files-found: error
          retention-days: 7

      - name: Signature (SignPath)
        if: env.SIGNPATH_ON == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: MPFever
          signing-policy-slug: release-signing
          artifact-configuration-slug: release
          github-artifact-id: ${{ steps.tosign.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-folders

      - name: Zip the signed folders
        if: env.SIGNPATH_ON == 'true'
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force signed | Out-Null
          foreach ($p in @(@('signed-folders\dist\MPFever', "MPFever-$v.zip"), @('signed-folders\dist-server\MPFever-Server', "MPFever-$v-server.zip"))) {
            foreach ($f in 'MPFever.exe', 'winhttp.dll') {
              $sig = Get-AuthenticodeSignature (Join-Path $p[0] $f)
              if ($sig.Status -ne 'Valid') { throw "$($p[0])\$f is not signed: $($sig.Status)" }
            }
            # (Windows PowerShell's zip, as build.bat makes it)
            powershell -NoProfile -Command "Add-Type -AssemblyName System.IO.Compression.FileSystem; [IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path '$($p[0])'), (Join-Path (Resolve-Path 'signed') '$($p[1])'), 'Optimal', `$true)"
            if ($LASTEXITCODE -ne 0) { throw "zip of $($p[0]) failed" }
          }

      - name: Signed archives
        if: env.SIGNPATH_ON == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MPFever-${{ steps.version.outputs.version }}-signed
          path: signed/*.zip
          if-no-files-found: error
          retention-days: 30

      # (the hashes for the release notes, on the run's page)
      - name: Hashes
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $signed = $env:SIGNPATH_ON -eq 'true'
          $dir = if ($signed) { 'signed' } else { 'release' }
          $lines = @("## MPFever $v ($(if ($signed) { 'signed' } else { 'NOT signed: SignPath is not set up' }))", "")
          foreach ($f in "MPFever-$v.zip", "MPFever-$v-server.zip") {
            $h = (Get-FileHash (Join-Path $dir $f) -Algorithm SHA256).Hash
            $lines += "- ``$f``, SHA-256 ``$h``"
          }
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $lines -join "`n"

  # (the relay, named as the other archives: MPFever-<version>-relay-linux-x64.tar.gz and MPFever-<version>-relay-win-x64.zip, each
  # with a folder MPFever-Relay holding the program and its guide; the hashes are on the run's page)
  linux-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Version
        id: version
        run: echo "version=$(sed -n 's/^set "VERSION=\([^"]*\)".*/\1/p' build.bat | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Publish Linux relay (x64)
        run: dotnet publish relay/MPFeverRelay.csproj -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o artifacts/linux

      - name: Test the published relay
        run: artifacts/linux/mpfever-relay --selftest

      # (tar.gz, not zip: it keeps the executable bit)
      - name: Pack
        run: |
          v="${{ steps.version.outputs.version }}"
          f="MPFever-$v-relay-linux-x64.tar.gz"
          mkdir -p release/MPFever-Relay
          cp artifacts/linux/mpfever-relay docs/RELAY.md release/MPFever-Relay/
          tar -czf "release/$f" -C release MPFever-Relay
          bt='`'
          echo "- $bt$f$bt, SHA-256 $bt$(sha256sum "release/$f" | cut -d' ' -f1)$bt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Linux relay
        uses: actions/upload-artifact@v4
        with:
          name: MPFever-${{ steps.version.outputs.version }}-relay-linux-x64
          path: release/MPFever-${{ steps.version.outputs.version }}-relay-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  # (optional, off unless "docker" is ticked when the workflow is started: the relay's image, the same as relay/Dockerfile, for x64
  # and arm64, on GitHub's container registry under the owner of the repository. It is built after the Linux relay passed its self-test,
  # and the image is self-tested once pushed. The package's visibility is set on its page on GitHub)
  docker-relay:
    if: ${{ inputs.docker }}
    needs: linux-relay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Version and image name
        id: v
        run: |
          echo "version=$(sed -n 's/^set "VERSION=\([^"]*\)".*/\1/p' build.bat | tr -d '\r')" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mpfever-relay-docker" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (x64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=MPFever relay (no game): the first player hosts through it
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
      - name: Test the pushed image (x64)
        run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}" --selftest

      - name: Summary
        run: |
          bt='`'
          echo "- Docker image $bt${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}$bt (and $bt:latest$bt), x64 and arm64" | tee -a "$GITHUB_STEP_SUMMARY"

  windows-relay:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path build.bat -Pattern '^set "VERSION=([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish Windows relay (x64)
        run: dotnet publish relay/MPFeverRelay.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o artifacts/windows

      - name: Test the published relay
        run: artifacts/windows/mpfever-relay.exe --selftest

      - name: Pack
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $f = "MPFever-$v-relay-win-x64.zip"
          New-Item -ItemType Directory -Force release/MPFever-Relay | Out-Null
          Copy-Item artifacts/windows/mpfever-relay.exe, docs/RELAY.md release/MPFever-Relay/
          Compress-Archive -Path release/MPFever-Relay -DestinationPath "release/$f"
          $h = (Get-FileHash "release/$f" -Algorithm SHA256).Hash
          "- ``$f``, SHA-256 ``$h``" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Windows relay
        uses: actions/upload-artifact@v4
        with:
          name: MPFever-${{ steps.version.outputs.version }}-relay-win-x64
          path: release/MPFever-${{ steps.version.outputs.version }}-relay-win-x64.zip
          if-no-files-found: error
          retention-days: 30
