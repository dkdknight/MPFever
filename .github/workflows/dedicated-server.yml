# The Linux dedicated server (server/): static checks, the package, the Docker image built and smoke-tested.
#
# The image always carries the LATEST OFFICIAL MPFever release: the package is built from that release's tag (build.bat) with the launcher
# changes of this branch applied on top (they disappear from the patch once a release contains them). So players on the official release can join.
#
# Publication to GHCR (ghcr.io/<owner>/mpfever-server, named like the relay's mpfever-relay) happens ONLY on purpose, after every job above has passed:
#   - pushing a tag  dedicated-server-v<mpfever version>[-<n>]   (for example dedicated-server-v0.9.1): image tags "<mpfever version>[-<n>]" and "experimental"
#   - or a manual run (workflow_dispatch, workflow file on the default branch) with "publish" ticked.
# A push or a pull request never publishes.
name: Dedicated server

on:
  pull_request:
    paths: ["server/**", "launcher/**", ".github/workflows/dedicated-server.yml"]
  push:
    branches: [main, "feature/dedicated-server"]
    tags: ["dedicated-server-v*"]
    paths: ["server/**", "launcher/**", ".github/workflows/dedicated-server.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the image to GHCR (only after the tests pass)"
        type: boolean
        default: false
      version_tag:
        description: "Image tag besides 'experimental' (the MPFever version, for example 0.9.1); empty: only 'experimental'"
        type: string
        default: ""
      mpfever_ref:
        description: "MPFever release tag to build the package from; empty: the latest official release"
        type: string
        default: ""

concurrency:
  group: dedicated-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UPSTREAM: https://github.com/dkdknight/MPFever.git

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Static checks (shell, Python, Compose, no secrets, no binaries)
        run: bash server/tests/check.sh

  package:
    # The same build as ci.yml (native module, launcher with warnings as errors, tests, archives), of the latest official release + this branch's launcher changes.
    runs-on: windows-2022
    timeout-minutes: 40
    outputs:
      mpfever_version: ${{ steps.ref.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lupa==2.8
      - name: Release to build, and the launcher changes of this branch
        id: ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.mpfever_ref }}
        run: |
          set -eu
          tag="${WANTED:-}"
          [ -n "$tag" ] || tag=$(gh release view --repo dkdknight/MPFever --json tagName --jq .tagName)
          echo "official release: $tag"
          git remote add upstream "$UPSTREAM" 2>/dev/null || true
          git fetch -q upstream main "refs/tags/$tag:refs/tags/upstream-$tag"
          git diff "upstream/main...HEAD" -- launcher > "$RUNNER_TEMP/launcher.patch"
          git worktree add -q --detach release-src "upstream-$tag"
          cd release-src
          if [ ! -s "$RUNNER_TEMP/launcher.patch" ]; then echo "no launcher changes to apply"
          elif git apply --reverse --check --ignore-whitespace "$RUNNER_TEMP/launcher.patch" 2>/dev/null; then echo "the release already contains the launcher changes"
          else git apply --ignore-whitespace "$RUNNER_TEMP/launcher.patch" && echo "launcher changes applied"; fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Build, test, pack
        shell: pwsh
        working-directory: release-src
        run: |
          cmd /c build.bat 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: MPFever-server-package-${{ github.sha }}
          path: release-src/release/MPFever-*-server.zip
          retention-days: 14
          if-no-files-found: error

  image:
    needs: [static, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MPFever-server-package-${{ github.sha }}
          path: server/dist
      - name: Package for the image
        working-directory: server/dist
        run: |
          ls -l
          cp ./*-server.zip MPFever-server.zip
          echo "PKG_VERSION=${{ needs.package.outputs.mpfever_version }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: mpfever-server:ci
          build-args: |
            VERSION=${{ env.PKG_VERSION }}
            VCS_REF=${{ github.sha }}
            SOURCE_REPO=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke tests
        run: |
          set -eu
          img=mpfever-server:ci
          # runs unprivileged
          test "$(docker run --rm --entrypoint id "$img" -u)" = 1001
          # contains no game file, no Valve file, no secret
          docker run --rm --entrypoint find "$img" / -xdev \( -iname 'TransportFever3.exe' -o -iname 'steamclient*.dll' -o -iname 'steam.exe' -o -iname 'steam.json' -o -iname '*.sav' \) -not -path '/proc/*' | tee /tmp/found
          test ! -s /tmp/found
          # licence texts and Dock are present, a healthcheck is defined
          docker run --rm --entrypoint sh "$img" -c 'test -f /opt/mpfever/dockhost.exe && test -f /opt/mpfever/licenses/madeira-dock/COPYING && test -f /opt/mpfever/pkg/MPFever.exe && test -f /opt/mpfever/pkg/winhttp.dll'
          docker inspect --format '{{.Config.Healthcheck.Test}}' "$img" | grep -q healthcheck.sh
          # pinned runtimes
          docker run --rm --entrypoint sh "$img" -c 'wine --version | grep -q "wine-11.0" && mono --version | head -1 && python3 -c "import qrcode"'
          # an empty volume gives explicit messages, not a crash
          docker volume create ci-data >/dev/null; docker volume create ci-game >/dev/null
          set +e
          out=$(docker run --rm -v ci-data:/data -v ci-game:/game "$img" status 2>&1); echo "$out"
          echo "$out" | grep -q "login" && echo "$out" | grep -q "install-game"
          out=$(docker run --rm -e WORLD=x -v ci-data:/data -v ci-game:/game "$img" run 2>&1); rc=$?; echo "$out"
          test $rc -eq 40 && echo "$out" | grep -q "run  login"
          # the Dock build is the pinned one, the Vulkan layer loads
          docker run --rm --entrypoint sh "$img" -c 'ls -l /opt/mpfever/libVkLayer_mpf_nulldraw.so /etc/vulkan/implicit_layer.d/'
      - name: Decide the tags to publish
        id: tags
        run: |
          set -eu
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          pub=false; vtag=""
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.publish }}" = true ]; then pub=true; vtag="${{ inputs.version_tag }}"; fi
          if [ "${{ github.ref_type }}" = tag ]; then
            pub=true; vtag="${{ github.ref_name }}"; vtag="${vtag#dedicated-server-v}"   # 0.9.1 or 0.9.1-2
          fi
          echo "publish=$pub" >> "$GITHUB_OUTPUT"; echo "repo=ghcr.io/$owner/mpfever-server" >> "$GITHUB_OUTPUT"; echo "vtag=$vtag" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: steps.tags.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish (tag push or manual run only)
        if: steps.tags.outputs.publish == 'true'
        run: |
          set -eu
          repo=${{ steps.tags.outputs.repo }}; vtag=${{ steps.tags.outputs.vtag }}
          docker tag mpfever-server:ci "$repo:experimental"; docker push "$repo:experimental"
          if [ -n "$vtag" ]; then docker tag mpfever-server:ci "$repo:$vtag"; docker push "$repo:$vtag"; fi
          echo "published $repo:experimental ${vtag:+and $repo:$vtag}" >> "$GITHUB_STEP_SUMMARY"
