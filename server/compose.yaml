# MPFever dedicated server (experimental). Setup and first start: README.md.   docker compose up -d
services:
  mpfever-server:
    image: ${MPFEVER_IMAGE:-ghcr.io/dkdknight/mpfever-server:experimental}
    container_name: mpfever-server
    restart: unless-stopped
    init: true
    stop_grace_period: 60s            # the world is saved and the game closed on `docker compose stop`
    ports:
      - "${PORT:-28090}:${PORT:-28090}"
    environment:
      WORLD: ${WORLD:?set WORLD in .env (the savegame to host)}
      SERVER_NAME: ${SERVER_NAME:-MPFever Server}
      PORT: ${PORT:-28090}
      PASSWORD: ${PASSWORD:-}
      MAX_PLAYERS: ${MAX_PLAYERS:-8}
      COMPANY_MODE: ${COMPANY_MODE:-shared}
      START_SPEED: ${START_SPEED:-1}
      PAUSE_WHEN_EMPTY: ${PAUSE_WHEN_EMPTY:-false}
      PLAYER_SPEED_CONTROL: ${PLAYER_SPEED_CONTROL:-true}
      AUTOSAVE_MINUTES: ${AUTOSAVE_MINUTES:-10}
      BACKUPS: ${BACKUPS:-10}
      PUBLIC: ${PUBLIC:-false}
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:-}
      MOTD: ${MOTD:-}
    volumes:
      - data:/data        # Wine prefix, Valve client, Steam session (secrets/), saves, launcher and its logs and backups
      - game:/game        # the "lite" game install (about 1 GB on disk)
    mem_limit: ${MEM_LIMIT:-14g}
    cpus: ${CPUS:-2}
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  data:
    name: ${DATA_VOLUME:-mpfever-data}
  game:
    name: ${GAME_VOLUME:-mpfever-game}
